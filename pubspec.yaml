name: ecoclean_mobile
description: EcoClean Ghana Operations Mobile (MVP)
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_polyline_points: ^3.1.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/ecoclean_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: assets/ecoclean_logo.png
  min_sdk_android: 21